<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Settings</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>

<h2>Settings</h2>

<label>Theme:</label>
<select id="themeSelect">
  <option value="light">Light</option>
  <option value="dark">Dark</option>
</select>
<button id="applyChanges">Apply Changes</button>


<hr>

<h3>Profiles</h3>

<label>Active Profile:</label>
<select id="profileSelect"></select>

<button id="addProfile">Add Profile</button>
<button id="deleteProfile">Delete Profile</button>

<div id="profileSettings">
    <h4>Profile Data</h4>

    <label>Hotkey for this profile:</label>
    <input id="hotkeyInput" type="text" placeholder="Click and press a key" readonly />

    <label>Provider:</label>
      <select id="providerSelect">
        <option value="google_gemini">Google Gemini</option>
        <option value="groq">Groq</option>
        <option value="openai">OpenAI</option>
      </select>

    <div id="providerFields">
      <!-- These fields will change depending on provider -->
      <!-- OpenAI: api key and model -->
      <!-- Anthropic: api key -->
      <!-- Gemini: api key -->
      <!-- Mistral: api key -->
      <!-- Groq: api key -->
    </div>

    <label>Prompt:</label><br>
    <textarea id="prompt" rows="4"></textarea>
</div>

<script type="module" src="settings.js"></script>
</body>
</html>
